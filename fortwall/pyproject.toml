[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fortwall-pool"
version = "0.1.0"
description = "Cluster a PHP app's URLs by syscall footprint into least-privilege php-fpm pools and enforce/measure attack-surface reduction (fortwall stage 2.5)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scikit-learn",
    "scipy",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fortwall = "fortwall_pool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
